<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTO MARKET LAOS</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#1a1a1a,#2b2b2b,#111);
  color:white;
}

/* HEADER */
header{
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  color:#00bfff;
}

.logo img{
  width:45px;
  height:45px;
  object-fit:contain;
  filter:drop-shadow(0 0 10px #00bfff);
}

/* NAV */
nav a{
  color:white;
  text-decoration:none;
  margin-left:15px;
  padding:8px 12px;
  border-radius:10px;
  transition:0.3s;
}

nav a:hover{
  background:#00bfff;
  box-shadow:0 0 15px #00bfff;
}

/* HERO */
.hero{
  height:480px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
    linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
    url('https://images.unsplash.com/photo-1503376780353-7e6692767b70');
  background-size:cover;
  background-position:center;
  position:relative;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:radial-gradient(circle, rgba(0,191,255,0.25), transparent 60%);
  animation:move 6s linear infinite;
}

@keyframes move{
  0%{transform:translate(-20%,-20%);}
  50%{transform:translate(20%,20%);}
  100%{transform:translate(-20%,-20%);}
}

.hero-content{
  position:relative;
  font-size:60px;
  font-weight:900;
  text-shadow:0 0 20px #00bfff;
}

/* SEARCH */
.search-box{
  padding:25px;
  text-align:center;
}

/* กล่อง input */
.search-box input{
  width:90%;
  max-width:550px;

  padding:15px 18px;

  border:none;
  border-radius:16px;

  font-size:16px;
  color:white;

  background:rgba(168, 169, 170, 0.1);
  backdrop-filter: blur(10px);

  outline:none;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.3),
    0 0 20px rgba(0,191,255,0.4);

  transition:0.3s;
}

/* เวลาโฟกัส */
.search-box input:focus{
  transform:scale(1.03);

  box-shadow:
    0 15px 40px rgba(0,0,0,0.4),
    0 0 25px #00bfff,
    0 0 50px rgba(0,191,255,0.5);
}

/* placeholder */
.search-box input::placeholder{
  color:#cbd5e1;
  letter-spacing:1px;
}

/* BRAND */
.brands{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  padding:20px;
}

.brand{
  background:rgba(0,0,0,0.6);
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
  transition:0.3s;
}

.brand:hover{
  background:#00bfff;
  transform:scale(1.1);
}

/* PRICE */
.price-filter{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  padding:10px 20px 25px;
}

/* ช่องใส่ราคา */
.price-filter input{
  width:200px;
  padding:14px 12px;

  border:none;
  border-radius:14px;

  font-size:15px;
  color:white;

  background:rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);

  outline:none;

  text-align:center;

  box-shadow:
    0 8px 20px rgba(0,0,0,0.25),
    0 0 15px rgba(0,191,255,0.2);

  transition:0.3s;
}

/* เวลา focus */
.price-filter input:focus{
  transform:scale(1.05);

  box-shadow:
    0 12px 30px rgba(0,0,0,0.35),
    0 0 25px #00bfff,
    0 0 45px rgba(0,191,255,0.4);
}

/* placeholder */
.price-filter input::placeholder{
  color:#cbd5e1;
}

/* ปุ่มค้นหา (เพิ่มให้ด้วย จะได้ครบ) */
.price-filter button{
  padding:14px 22px;

  border:none;
  border-radius:14px;

  cursor:pointer;

  font-weight:bold;
  color:white;

  background:linear-gradient(135deg,#feffff,#5d5d5d);

  box-shadow:
    0 10px 25px rgba(0,191,255,0.3);

  transition:0.3s;
}

.price-filter button:hover{
  transform:translateY(-2px);
  box-shadow:
    0 15px 35px rgba(0,191,255,0.5);
}

/* CAR */
.cars{
  padding:30px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:0.4s;
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 20px 40px rgba(0,191,255,0.3);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card-content{
  padding:12px;
}

.price{
  color:red;
  font-weight:bold;
}

/* MODAL */
#modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.85);
  z-index:999;
  overflow:auto;
  padding:20px;
}

#modalContent{
  max-width:600px;
  margin:auto;
  background:white;
  border-radius:15px;
  padding:15px;
  color:black;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="123.png">
    AUTO MARKET LAOS
  </div>

  <div>👤 <span id="user"></span></div>

  <!-- 🔥 PROFILE FIXED HERE -->
  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="profile.html">👤 Profile</a>
  </nav>
</header>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">AUTO MARKET LAOS</div>
</div>

<!-- BRAND -->
<div class="brands">
  <div class="brand" onclick="filterBrand('TOYOTA')">TOYOTA</div>
  <div class="brand" onclick="filterBrand('BMW')">BMW</div>
  <div class="brand" onclick="filterBrand('HONDA')">HONDA</div>
  <div class="brand" onclick="filterBrand('ALL')">ALL</div>
</div>

<!-- SEARCH -->
<div class="search-box">
  <input type="text" id="searchInput" placeholder="ค้นหา..." onkeyup="searchCars()">
</div>

<!-- PRICE -->
<div class="price-filter">
  <input type="number" id="minPrice" placeholder="ราคาต่ำสุด">
  <input type="number" id="maxPrice" placeholder="ราคาสูงสุด">
  <button onclick="filterPrice()">ค้นหา</button>
</div>

<!-- LIST -->
<section class="cars" id="carList"></section>

<!-- MODAL -->
<div id="modal">
  <div id="modalContent"></div>
</div>

<script>

const user = localStorage.getItem("currentUser") || "User";
document.getElementById("user").innerText = user;

let cars = JSON.parse(localStorage.getItem("cars")) || [];

/* RENDER */
function renderCars(list = cars){

  let html = "";

  list.forEach(car=>{

    let cover = Array.isArray(car.img) ? car.img[0] : car.img;

    html += `
      <div class="card" onclick="openDetail(${car.id})">

        <img src="${cover}">

        <div class="card-content">

          <h3>${car.name || "-"}</h3>
          <p>🏷 ${car.brand || "-"}</p>
          <p>📅 ${car.year || "-"}</p>

          <div class="price">$${car.price || "-"}</div>

        </div>

      </div>
    `;
  });

  carList.innerHTML = html;
}

/* FILTER */
function filterBrand(b){
  if(b==="ALL") return renderCars(cars);
  renderCars(cars.filter(c => (c.brand||"").toUpperCase()===b));
}

/* SEARCH */
function searchCars(){
  const key = searchInput.value.toLowerCase();
  renderCars(cars.filter(c =>
    (c.name||"").toLowerCase().includes(key) ||
    (c.brand||"").toLowerCase().includes(key) ||
    (c.year||"").toString().includes(key)
  ));
}

/* PRICE */
function filterPrice(){
  const min = Number(minPrice.value)||0;
  const max = Number(maxPrice.value)||Infinity;

  renderCars(cars.filter(c =>
    Number(c.price)>=min && Number(c.price)<=max
  ));
}

/* POPUP */
function openDetail(id){

  const car = cars.find(c=>c.id===id);
  if(!car) return;

  let images = Array.isArray(car.img)?car.img:[car.img];

  let imgs="";
  images.forEach(i=>{
    imgs+=`<img src="${i}" style="width:100%;margin-bottom:10px;">`;
  });

  modalContent.innerHTML=`
    <h2>${car.name}</h2>
    ${imgs}
    <p>🏷 ${car.brand}</p>
    <p>📅 ${car.year}</p>
    <div style="color:green;font-size:20px;">$${car.price}</div>

    <button onclick="closeModal()"
    style="width:100%;padding:10px;background:red;color:white;border:none;border-radius:10px;">
      ปิด
    </button>
  `;

  modal.style.display="block";
}

function closeModal(){
  modal.style.display="none";
}

renderCars();

</script>

</body>
</html>
